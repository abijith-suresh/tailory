# Tailory with Postgres. Build the tarball first: npm run pack:tarball --workspace tailory
# Needs TAILORY_AUTH_SECRET (32+ random characters). Email and password sign-in is on; set
# TAILORY_PUBLIC_URL to the HTTPS address of your reverse proxy before exposing the app beyond
# this computer.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:4413:4413"
    environment:
      DATABASE_URL: postgres://tailory:${POSTGRES_PASSWORD:-tailory}@db:5432/tailory
      TAILORY_AUTH_SECRET: ${TAILORY_AUTH_SECRET:?Set TAILORY_AUTH_SECRET to 32+ random characters}
      TAILORY_PUBLIC_URL: ${TAILORY_PUBLIC_URL:-http://127.0.0.1:4413}
      TAILORY_AUTH_EMAIL_PASSWORD: ${TAILORY_AUTH_EMAIL_PASSWORD:-true}
      TAILORY_TRUST_PROXY: ${TAILORY_TRUST_PROXY:-false}
      TAILORY_GITHUB_CLIENT_ID: ${TAILORY_GITHUB_CLIENT_ID:-}
      TAILORY_GITHUB_CLIENT_SECRET: ${TAILORY_GITHUB_CLIENT_SECRET:-}
      TAILORY_GOOGLE_CLIENT_ID: ${TAILORY_GOOGLE_CLIENT_ID:-}
      TAILORY_GOOGLE_CLIENT_SECRET: ${TAILORY_GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_USER: tailory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tailory}
      POSTGRES_DB: tailory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailory -d tailory"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
