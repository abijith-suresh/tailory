name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    # npm ci, then npm run verify: type-check, lint, format check, unit tests
    # with coverage, and build.
    uses: abijith-suresh/workflows/.github/workflows/npm-quality.yml@c299f85c6c0c73fff9b2a1e420484f5bdb482ff1 # v0.9.0

  dependency-review:
    name: dependency-review
    permissions:
      contents: read
    uses: abijith-suresh/workflows/.github/workflows/dependency-review.yml@c299f85c6c0c73fff9b2a1e420484f5bdb482ff1 # v0.9.0

  # Repository-local jobs go here; add each one to the gate's needs.

  # A PR that changes a versioned package needs a patch Changeset naming it. The script exempts
  # docs, ci, chore, style, and test titles. A retitled PR keeps its last result until this job is
  # re-run.
  changeset:
    name: changeset
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the complete pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the Node version from mise.toml
        id: node
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^node[[:space:]]*=[[:space:]]*"\([0-9.]*\)".*/\1/p' mise.toml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "mise.toml must pin node as major.minor.patch" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install the Changesets parser without lifecycle scripts
        run: npm ci --ignore-scripts

      # The gate counts a skipped job as a failure, so the version packages PR skips this step
      # instead of the whole job.
      - name: Require a Changeset for changed packages
        if: >-
          !(
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref == 'changeset-release/main'
          )
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: npm run changeset:check

  # The server app's migrations against a real Postgres. The ci job's unit tests skip this file.
  app-postgres:
    name: app-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: tailory
          POSTGRES_PASSWORD: tailory
          POSTGRES_DB: tailory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tailory -d tailory"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Node version from mise.toml
        id: node
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^node[[:space:]]*=[[:space:]]*"\([0-9.]*\)".*/\1/p' mise.toml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "mise.toml must pin node as major.minor.patch" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Run the database tests against Postgres
        env:
          TAILORY_TEST_DATABASE_URL: postgres://tailory:tailory@127.0.0.1:5432/tailory
        run: npm run test --workspace tailory -- src/server/db/

  # Packs the server app, installs the tarball in an empty folder, and starts it; then builds
  # the Docker image from the same tarball and runs it with Postgres.
  app-package:
    name: app-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Node version from mise.toml
        id: node
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^node[[:space:]]*=[[:space:]]*"\([0-9.]*\)".*/\1/p' mise.toml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "mise.toml must pin node as major.minor.patch" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test the packed app
        run: npm run test:smoke --workspace tailory

      - name: Start the Docker image with Postgres
        working-directory: apps/app
        run: docker compose up --detach --build --wait --wait-timeout 120

      - name: Check the container answers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:4413/ | grep --quiet "Tailory is running"
          curl --fail --silent --show-error http://127.0.0.1:4413/healthz

      - name: Show container logs
        if: always()
        working-directory: apps/app
        run: docker compose logs

      - name: Stop the containers
        if: always()
        working-directory: apps/app
        run: docker compose down --volumes

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Node version from mise.toml
        id: node
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^node[[:space:]]*=[[:space:]]*"\([0-9.]*\)".*/\1/p' mise.toml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "mise.toml must pin node as major.minor.patch" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Run browser tests
        # test:e2e serves the build from the previous step.
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: |
            apps/site/test-results/
            apps/site/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: gate
    if: ${{ !cancelled() }}
    needs: [ci, dependency-review, changeset, e2e, app-postgres, app-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        uses: abijith-suresh/workflows/.github/actions/gate@c299f85c6c0c73fff9b2a1e420484f5bdb482ff1 # v0.9.0
        with:
          needs: ${{ toJSON(needs) }}
