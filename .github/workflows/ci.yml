name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bun-quality:
    name: bun-quality
    uses: abijith-suresh/workflows/.github/workflows/bun-quality.yml@e59572c426373f5864ef1a6dad2524b47280a30c # v0.4.1
    permissions:
      contents: read

  dependency-review:
    name: dependency-review
    uses: abijith-suresh/workflows/.github/workflows/dependency-review.yml@e59572c426373f5864ef1a6dad2524b47280a30c # v0.4.1
    permissions:
      contents: read

  quality:
    name: quality
    if: always()
    needs: [bun-quality, dependency-review]
    runs-on: ubuntu-latest

    steps:
      - name: Check required quality jobs
        run: |
          if [[ "${{ needs.bun-quality.result }}" != "success" || "${{ needs.dependency-review.result }}" != "success" ]]; then
            echo "bun-quality and dependency-review must both pass" >&2
            exit 1
          fi
