name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bun-quality:
    name: bun-quality
    uses: abijith-suresh/workflows/.github/workflows/bun-quality.yml@0f257b2642d2a010fefe0ff9d03374799d73eb44 # v0.3.0
    permissions:
      contents: read

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5

  quality:
    name: quality
    if: always()
    needs: [bun-quality, dependency-review]
    runs-on: ubuntu-latest

    steps:
      - name: Check required quality jobs
        run: |
          if [[ "${{ needs.bun-quality.result }}" != "success" || "${{ needs.dependency-review.result }}" != "success" ]]; then
            echo "bun-quality and dependency-review must both pass" >&2
            exit 1
          fi
