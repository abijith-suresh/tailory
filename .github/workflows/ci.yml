name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: abijith-suresh/workflows/.github/workflows/ci.yml@6838f8e2495013c024606bbf8d63d3d5c66344fa # 0.8.0
    permissions:
      contents: read

  dependency-review:
    name: dependency-review
    uses: abijith-suresh/workflows/.github/workflows/dependency-review.yml@6838f8e2495013c024606bbf8d63d3d5c66344fa # 0.8.0
    permissions:
      contents: read

  gate:
    name: gate
    if: ${{ !cancelled() }}
    needs: [ci, dependency-review]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require CI success
        shell: bash
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          if [[ "$CI_RESULT" != success || "$DEPENDENCY_REVIEW_RESULT" != success ]]; then
            echo "ci result: $CI_RESULT" >&2
            echo "dependency-review result: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi
