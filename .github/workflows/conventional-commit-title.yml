name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title-check:
    name: title-check
    uses: abijith-suresh/workflows/.github/workflows/conventional-commit-title.yml@0f257b2642d2a010fefe0ff9d03374799d73eb44 # v0.3.0
    permissions:
      pull-requests: read

  pr-title:
    name: pr-title
    if: always()
    needs: title-check
    runs-on: ubuntu-latest

    steps:
      - name: Check required title job
        run: |
          if [[ "${{ needs.title-check.result }}" != "success" ]]; then
            echo "title-check must pass" >&2
            exit 1
          fi
