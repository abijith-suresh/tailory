name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Open or update the version packages pull request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the Node version from mise.toml
        id: node
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^node[[:space:]]*=[[:space:]]*"\([0-9.]*\)".*/\1/p' mise.toml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "mise.toml must pin node as major.minor.patch" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      # Only opens or updates changeset-release/main. There is no publish step: nothing goes to npm,
      # and no tags or GitHub Releases are created, until publishing is enabled in its own change.
      - name: Open or update the version packages pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.RELEASE_TOKEN }}
